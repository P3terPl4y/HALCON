
<!DOCTYPE html>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
/* ============================================================
   BUFAL · Design System v7.0  (CSS íntegro — no tocar)
   ============================================================ */
:root{
  --tf-yellow-500:#F59E0B;--tf-yellow-600:#D97706;--tf-yellow-050:#FEF3C7;
  --tf-red-500:#EF4444;--tf-red-600:#DC2626;--tf-red-400:#F87171;--tf-red-050:#FEF2F2;
  --tf-white:#FFFFFF;--tf-white-soft:#FAFBFC;--tf-white-overlay:rgba(255,255,255,.60);
  --tf-gray-050:#F9FAFB;--tf-gray-100:#F3F4F6;--tf-gray-150:#E5E7EB;--tf-gray-200:#E5E7EB;
  --tf-gray-300:#D1D5DB;--tf-gray-400:#9CA3AF;--tf-gray-500:#6B7280;--tf-gray-600:#4B5563;
  --tf-gray-700:#374151;--tf-gray-800:#1F2937;--tf-gray-900:#111827;--tf-gray-950:#0B0F14;
  --tf-success:#10B981;--tf-success-600:#059669;--tf-success-bg:#D1FAE5;
  --tf-warning:#F59E0B;--tf-warning-bg:#FEF3C7;--tf-info:#3B82F6;--tf-info-bg:#DBEAFE;
  --tf-danger:var(--tf-red-500);--tf-danger-bg:var(--tf-red-050);
  --tf-bg:#F3F4F6;--tf-surface:#FFFFFF;--tf-surface-2:#F9FAFB;--tf-surface-3:#F3F4F6;
  --tf-surface-overlay:rgba(255,255,255,.94);--tf-overlay:rgba(11,15,20,.55);
  --tf-text:#0B0F14;--tf-text-muted:#4B5563;--tf-text-subtle:#9CA3AF;--tf-text-invert:#FFFFFF;
  --tf-border:#E5E7EB;--tf-border-strong:#D1D5DB;--tf-border-white:rgba(255,255,255,.75);
  --tf-font-display:'TT Autonomous','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --tf-font-body:'TT Autonomous','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --tf-font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --tf-fs-xs:.75rem;--tf-fs-sm:.8125rem;--tf-fs-base:.9375rem;--tf-fs-md:1.0625rem;
  --tf-fs-lg:1.25rem;--tf-fs-xl:1.5rem;--tf-fs-2xl:1.875rem;--tf-fs-3xl:2.25rem;
  --tf-fw-regular:400;--tf-fw-medium:500;--tf-fw-semibold:600;--tf-fw-bold:700;
  --tf-lh-tight:1.2;--tf-lh-base:1.5;--tf-lh-loose:1.65;
  --tf-tracking-wide:.04em;--tf-tracking-tight:-.01em;
  --tf-space-1:.25rem;--tf-space-2:.5rem;--tf-space-3:.75rem;--tf-space-4:1rem;
  --tf-space-5:1.25rem;--tf-space-6:1.5rem;--tf-space-8:2rem;--tf-space-10:2.5rem;--tf-space-12:3rem;
  --tf-radius-xs:4px;--tf-radius-sm:6px;--tf-radius-md:10px;--tf-radius-lg:14px;--tf-radius-pill:999px;
  --tf-shadow-xs:0 1px 2px rgba(11,15,20,.06);
  --tf-shadow-sm:0 1px 2px rgba(11,15,20,.06),0 1px 3px rgba(11,15,20,.04);
  --tf-shadow-md:0 2px 4px rgba(11,15,20,.05),0 4px 12px rgba(11,15,20,.08);
  --tf-shadow-lg:0 8px 24px rgba(11,15,20,.10),0 2px 6px rgba(11,15,20,.06);
  --tf-shadow-red:0 6px 18px rgba(245,158,11,.28);
  --tf-focus-ring:0 0 0 4px rgba(245,158,11,.22);
  --tf-focus-ring-ok:0 0 0 4px rgba(16,185,129,.22);
  --tf-ease:cubic-bezier(.22,1,.36,1);
  --tf-dur-fast:140ms;--tf-dur:220ms;--tf-dur-slow:380ms;
  --tf-gradient-red:linear-gradient(135deg,#FBBF24 0%,#F59E0B 55%,#B45309 100%);
  --tf-gradient-danger:linear-gradient(135deg,#F87171 0%,#EF4444 55%,#991B1B 100%);
  --tf-gradient-metal:linear-gradient(180deg,#FFFFFF 0%,#F3F4F6 100%);
  --tf-gradient-dark:linear-gradient(180deg,#1F2937 0%,#0B0F14 100%);
  --tf-gradient-highway:linear-gradient(90deg,#0B0F14 0%,#F59E0B 100%);
  --tf-aside-width:340px;--tf-gap:1.75rem;
}
[data-theme="dark"]{
  --tf-bg:#0B0F14;--tf-surface:#101A1D;--tf-surface-2:#172326;--tf-surface-3:#1F2937;
  --tf-surface-overlay:rgba(16,26,29,.85);--tf-overlay:rgba(0,0,0,.65);
  --tf-white:#FFFFFF;--tf-white-soft:#E8ECEE;--tf-white-overlay:rgba(255,255,255,.06);
  --tf-gray-050:#172326;--tf-gray-100:#101A1D;--tf-gray-200:#1A282C;--tf-gray-300:#243438;
  --tf-gray-400:#3A4D51;--tf-gray-500:#5C7075;--tf-gray-600:#8A9C9F;--tf-gray-700:#B5C3C5;
  --tf-gray-800:#D5DEDF;--tf-gray-900:#E8EEEF;--tf-gray-950:#F4F7F7;
  --tf-text:#E8EEEF;--tf-text-muted:#8A9C9F;--tf-text-subtle:#5C7075;--tf-text-invert:#0B0F14;
  --tf-border:#1F2937;--tf-border-strong:#2A3D41;--tf-border-white:rgba(255,255,255,.10);
  --tf-success-bg:rgba(16,185,129,.18);--tf-warning-bg:rgba(245,158,11,.18);
  --tf-info-bg:rgba(59,130,246,.18);--tf-danger-bg:rgba(239,68,68,.18);
  --tf-red-050:rgba(239,68,68,.14);--tf-yellow-050:rgba(245,158,11,.14);
  --tf-shadow-xs:0 1px 2px rgba(0,0,0,.5);--tf-shadow-sm:0 1px 3px rgba(0,0,0,.55);
  --tf-shadow-md:0 4px 14px rgba(0,0,0,.6);--tf-shadow-lg:0 12px 32px rgba(0,0,0,.65);
  --tf-gradient-metal:linear-gradient(180deg,#1A282C 0%,#101A1D 100%);
  --tf-gradient-highway:linear-gradient(90deg,#F59E0B 0%,#FBBF24 100%);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--tf-font-body);font-size:var(--tf-fs-base);line-height:var(--tf-lh-base);color:var(--tf-text);min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--tf-bg);transition:background-color var(--tf-dur) var(--tf-ease),color var(--tf-dur) var(--tf-ease)}
h1,h2,h3,h4,h5,h6{font-family:var(--tf-font-display);font-weight:var(--tf-fw-semibold);letter-spacing:var(--tf-tracking-tight);color:var(--tf-text);margin:0 0 var(--tf-space-3);line-height:var(--tf-lh-tight)}
h1{font-size:var(--tf-fs-3xl)}h2{font-size:var(--tf-fs-2xl)}h3{font-size:var(--tf-fs-xl)}h4,h5{font-size:var(--tf-fs-lg)}h6{font-size:var(--tf-fs-md)}
p{margin:0 0 var(--tf-space-3)}
a{color:var(--tf-yellow-600);text-decoration:none;transition:color var(--tf-dur-fast) var(--tf-ease)}
a:hover{color:var(--tf-yellow-500)}
[data-theme="dark"] a{color:var(--tf-yellow-500)}
::selection{background:var(--tf-yellow-500);color:var(--tf-gray-950)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--tf-surface-2)}
::-webkit-scrollbar-thumb{background:var(--tf-gray-400);border-radius:var(--tf-radius-pill);border:2px solid var(--tf-surface-2)}
:focus-visible{outline:2px solid var(--tf-yellow-500);outline-offset:2px;border-radius:var(--tf-radius-xs)}

/* === App Shell === */
.bf-app{min-height:100vh;display:flex;flex-direction:column;background:var(--tf-bg)}
.bf-topbar{position:sticky;top:0;z-index:100;display:grid;grid-template-columns:220px minmax(0,1fr) 220px;align-items:center;gap:16px;padding:0 16px;min-height:64px;background:var(--tf-surface-overlay);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--tf-border);box-shadow:var(--tf-shadow-sm)}
.bf-topbar__left{grid-column:1;display:flex;align-items:center;min-width:0}
.bf-topbar__context{grid-column:2;display:inline-flex;align-items:center;gap:.5rem;color:var(--tf-text-muted);font-size:.78rem;font-weight:700;letter-spacing:.03em;justify-self:center}
.bf-topbar__context i{color:var(--tf-yellow-600)}
.bf-topbar__right{grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.bf-brand{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .8rem;border-left:3px solid var(--tf-yellow-500);text-decoration:none}
.bf-brand__mark{width:32px;height:32px;border-radius:var(--tf-radius-sm);background:var(--tf-gradient-red);color:var(--tf-gray-950);display:grid;place-items:center;font-size:1rem;box-shadow:var(--tf-shadow-red)}
.bf-brand__name{font-family:var(--tf-font-display);font-size:var(--tf-fs-base);font-weight:var(--tf-fw-bold);letter-spacing:-.02em;color:var(--tf-text)}
.bf-user-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .75rem;background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:var(--tf-radius-pill);cursor:pointer;font-family:inherit}
.bf-user-btn__avatar{width:32px;height:32px;border-radius:50%;background:var(--tf-gradient-red);color:var(--tf-gray-950);display:grid;place-items:center;font-size:.9rem;box-shadow:var(--tf-shadow-red)}
.bf-user-btn__info{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.bf-user-btn__info strong{font-size:var(--tf-fs-sm);font-weight:var(--tf-fw-semibold);color:var(--tf-text);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.bf-user-btn__info small{font-size:.7rem;color:var(--tf-text-muted);text-transform:uppercase;font-weight:var(--tf-fw-semibold)}
.bf-body{flex:1;display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}
.bf-sidebar{position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;padding:1rem .65rem;background:var(--tf-surface);border-right:1px solid var(--tf-border)}
.bf-sidebar__header{padding:0 .7rem .9rem;margin-bottom:.75rem;border-bottom:1px solid var(--tf-border)}
.bf-sidebar__title{font-family:var(--tf-font-display);font-size:.7rem;font-weight:var(--tf-fw-bold);text-transform:uppercase;letter-spacing:.08em;color:var(--tf-text-subtle)}
.bf-sidebar__nav{display:flex;flex-direction:column;gap:2px}
.bf-sidebar__link{display:flex;align-items:center;gap:.65rem;padding:.68rem .72rem;border-radius:7px;color:var(--tf-text-muted);font-size:.82rem;font-weight:var(--tf-fw-semibold);text-decoration:none;border-left:2px solid transparent;transition:background var(--tf-dur-fast) var(--tf-ease)}
.bf-sidebar__link:hover{background:#fff8e8;color:var(--tf-text)}
[data-theme="dark"] .bf-sidebar__link:hover{background:rgba(245,158,11,.12)}
.bf-sidebar__link[aria-current="page"]{background:#fff4d2;color:#a85b00;border-left-color:#f59e0b}
[data-theme="dark"] .bf-sidebar__link[aria-current="page"]{background:rgba(245,158,11,.16);color:var(--tf-yellow-500)}
.bf-sidebar__icon{width:1.15rem;text-align:center;color:#98a1ae;font-size:1rem}
.bf-sidebar__link[aria-current="page"] .bf-sidebar__icon{color:#d97706}
.bf-sidebar__label{flex:1;min-width:0}
.bf-main{min-width:0;padding:1.5rem clamp(1rem,2.6vw,2.75rem);display:flex;flex-direction:column;gap:1.25rem}
.bf-main>.container{width:100%;max-width:1280px;margin-inline:auto}
.bf-main__header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--tf-border)}
.bf-main__title{font-family:var(--tf-font-display);font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.03em;margin:0}
.bf-main__subtitle{margin:.25rem 0 0;color:var(--tf-text-muted);font-size:var(--tf-fs-sm)}

/* === Cards / botones / utilidades === */
.card{background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:var(--tf-radius-md);box-shadow:var(--tf-shadow-xs);overflow:hidden}
.card-header{padding:.9rem 1.1rem;border-bottom:1px solid var(--tf-border);background:linear-gradient(180deg,var(--tf-white-overlay),transparent);display:flex;align-items:center;justify-content:space-between;position:relative}
.card-header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tf-gradient-highway);opacity:.85}
.card-header h5{margin:0;font-size:var(--tf-fs-md);font-weight:var(--tf-fw-semibold);display:inline-flex;align-items:center;gap:.5rem}
.card-header h5 i{color:var(--tf-yellow-500)}
.card-body{padding:1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1.1rem;font-family:var(--tf-font-body);font-size:var(--tf-fs-sm);font-weight:var(--tf-fw-bold);letter-spacing:.02em;line-height:1.15;text-align:center;white-space:nowrap;user-select:none;cursor:pointer;border-radius:7px;border:1px solid transparent;outline:none;transition:transform var(--tf-dur-fast) var(--tf-ease),background-color var(--tf-dur-fast) var(--tf-ease),box-shadow var(--tf-dur-fast) var(--tf-ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:#f59e0b;color:#19120a;border-color:#dc8506}
.btn-primary:hover{background:#d97706;color:#fff}
.btn-secondary{background:#334155;color:#fff;border-color:#273449}
.btn-secondary:hover{background:#1e293b}
.btn-outline-primary{background:#fff;color:var(--tf-yellow-600);border-color:var(--tf-yellow-500)}
.btn-outline-primary:hover{background:var(--tf-yellow-500);color:#19120a}
.btn-outline-secondary{background:#fff;color:var(--tf-text-muted);border-color:var(--tf-border-strong)}
.btn-outline-danger{background:#fff;color:var(--tf-red-500);border-color:var(--tf-red-500)}
.btn-outline-danger:hover{background:var(--tf-red-500);color:#fff}
.btn-sm{padding:.4rem .8rem;font-size:var(--tf-fs-xs)}
.btn-lg{padding:.8rem 1.5rem;font-size:var(--tf-fs-base)}
.btn-block{width:100%}
.btn i{font-size:1.05em;line-height:1}
.form-control,.form-select{width:100%;min-height:38px;padding:.55rem .85rem;background:var(--tf-surface);border:1px solid var(--tf-border-strong);border-radius:7px;color:var(--tf-text);font-family:var(--tf-font-body);font-size:var(--tf-fs-base);transition:border-color var(--tf-dur-fast) var(--tf-ease),box-shadow var(--tf-dur-fast) var(--tf-ease)}
.form-control:focus,.form-select:focus{outline:none;border-color:var(--tf-yellow-500);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.form-label{display:block;margin-bottom:.35rem;font-size:.76rem;font-weight:var(--tf-fw-semibold);color:var(--tf-text);text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-flex;align-items:center;gap:.3em;padding:.28em .65em;font-size:.68rem;font-weight:700;border-radius:var(--tf-radius-pill);border:1px solid transparent;text-transform:uppercase;letter-spacing:.02em}
.badge.bg-success{background:var(--tf-success-bg);color:var(--tf-success);border-color:rgba(16,185,129,.35)}
.badge.bg-danger{background:var(--tf-danger-bg);color:var(--tf-red-500);border-color:rgba(239,68,68,.35)}
.badge.bg-secondary{background:var(--tf-surface-3);color:var(--tf-text-muted);border-color:var(--tf-border)}
.alert{padding:.75rem 1rem;border-radius:8px;border:1px solid var(--tf-border);font-size:var(--tf-fs-sm);display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.alert-success{background:var(--tf-success-bg);color:var(--tf-success);border-color:rgba(16,185,129,.3)}
.alert-success::before{background:var(--tf-success)}
.alert-danger{background:var(--tf-danger-bg);color:var(--tf-red-600);border-color:rgba(239,68,68,.3)}
.alert-danger::before{background:var(--tf-red-500)}
.tf-empty{padding:3rem 1rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.75rem;border:1px dashed var(--tf-border-strong);border-radius:var(--tf-radius-md);background:var(--tf-surface-2)}
.tf-empty__icon{width:64px;height:64px;border-radius:50%;background:var(--tf-surface-3);display:grid;place-items:center;color:var(--tf-text-subtle);font-size:1.9rem;position:relative}
.tf-empty h4{margin:0;font-family:var(--tf-font-display);font-size:var(--tf-fs-md);font-weight:var(--tf-fw-semibold)}
.tf-empty p{margin:0;color:var(--tf-text-muted);font-size:var(--tf-fs-sm);max-width:380px}

/* === Perfil === */
.tf-profile{display:flex;flex-direction:column;gap:1.25rem;width:100%}
.tf-profile__hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.25rem;padding:1.25rem;background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:var(--tf-radius-md);box-shadow:var(--tf-shadow-sm);position:relative;overflow:hidden}
.tf-profile__hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tf-gradient-highway)}
.tf-profile__avatar{position:relative;width:72px;height:72px;border-radius:50%;background:var(--tf-gradient-red);color:var(--tf-gray-950);display:grid;place-items:center;font-size:2rem;box-shadow:var(--tf-shadow-red);flex-shrink:0}
.tf-profile__avatar-status{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;background:var(--tf-success);border:3px solid var(--tf-surface)}
.tf-profile__identity h1{margin:0 0 .25rem;font-family:var(--tf-font-display);font-size:1.5rem;letter-spacing:-.02em}
.tf-profile__email{display:inline-flex;align-items:center;gap:.4rem;color:var(--tf-text-muted);font-size:var(--tf-fs-sm);margin:0}
.tf-profile__id{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:.6rem .9rem;background:var(--tf-surface-3);border:1px solid var(--tf-border);border-radius:var(--tf-radius-sm)}
.tf-profile__id small{font-size:.68rem;text-transform:uppercase;font-weight:var(--tf-fw-bold);letter-spacing:.06em;color:var(--tf-text-subtle)}
.tf-profile__id strong{font-family:var(--tf-font-mono);font-size:1.1rem;color:var(--tf-yellow-600);line-height:1}

/* Layout perfil: mapa grande + panel */
.tf-profile__layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1.25rem;align-items:start}
@media(max-width:960px){.tf-profile__layout{grid-template-columns:1fr}}
.tf-map-card{position:relative;background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:var(--tf-radius-md);box-shadow:var(--tf-shadow-sm);overflow:hidden}
.tf-map-card__head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--tf-border);background:linear-gradient(180deg,var(--tf-white-overlay),transparent);position:relative}
.tf-map-card__head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tf-gradient-highway);opacity:.85}
.tf-map-card__title{margin:0;font-family:var(--tf-font-display);font-size:var(--tf-fs-md);font-weight:var(--tf-fw-semibold);display:inline-flex;align-items:center;gap:.5rem}
.tf-map-card__title i{color:var(--tf-yellow-500)}
.tf-map-card__status{display:inline-flex;align-items:center;gap:.4rem;font-size:var(--tf-fs-xs);font-weight:600;color:var(--tf-text-muted);padding:.25rem .65rem;border-radius:var(--tf-radius-pill);background:var(--tf-surface-3);border:1px solid var(--tf-border)}
.tf-map-card__status .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;transition:background var(--tf-dur) var(--tf-ease)}
.tf-map-card__status.is-live .dot{background:var(--tf-success);animation:tf-pulse 1.6s ease-in-out infinite}
.tf-map-card__status.is-idle .dot{background:var(--tf-warning)}
.tf-map-card__status.is-off .dot{background:var(--tf-red-500)}
@keyframes tf-pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Altura EXPLÍCITA — Leaflet la necesita */
#profile-map{width:100%;height:560px;background:var(--tf-surface-3);position:relative;z-index:1}
@media(max-width:960px){#profile-map{height:420px}}
@media(max-width:575.98px){#profile-map{height:340px}}

/* Overlay vacío sobre el mapa */
.tf-map-overlay{position:absolute;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(243,244,246,.75),rgba(243,244,246,.92));backdrop-filter:blur(3px);z-index:500;padding:1.5rem;text-align:center;transition:opacity var(--tf-dur) var(--tf-ease),visibility var(--tf-dur) var(--tf-ease)}
[data-theme="dark"] .tf-map-overlay{background:linear-gradient(180deg,rgba(11,15,20,.72),rgba(11,15,20,.92))}
.tf-map-overlay[hidden]{display:none}
.tf-map-overlay__inner{display:flex;flex-direction:column;align-items:center;gap:.75rem;max-width:400px}
.tf-map-overlay__icon{width:64px;height:64px;border-radius:50%;background:var(--tf-surface);border:1px solid var(--tf-border);display:grid;place-items:center;color:var(--tf-yellow-600);font-size:1.8rem;box-shadow:var(--tf-shadow-sm)}
.tf-map-overlay h4{margin:0;font-family:var(--tf-font-display);font-size:var(--tf-fs-md);font-weight:var(--tf-fw-semibold);color:var(--tf-text)}
.tf-map-overlay p{margin:0;color:var(--tf-text-muted);font-size:var(--tf-fs-sm);line-height:1.45}

/* Panel lateral: lista de halcones */
.tf-halcones-panel{display:flex;flex-direction:column;gap:.75rem;background:var(--tf-surface);border:1px solid var(--tf-border);border-radius:var(--tf-radius-md);box-shadow:var(--tf-shadow-sm);overflow:hidden}
.tf-halcones-panel__head{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--tf-border);position:relative}
.tf-halcones-panel__head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tf-gradient-highway);opacity:.85}
.tf-halcones-panel__title{margin:0;font-family:var(--tf-font-display);font-size:var(--tf-fs-sm);font-weight:var(--tf-fw-semibold);text-transform:uppercase;letter-spacing:.04em;color:var(--tf-text-muted);display:inline-flex;align-items:center;gap:.45rem}
.tf-halcones-panel__title i{color:var(--tf-yellow-500)}
.tf-halcones-panel__count{font-size:.7rem;font-weight:700;color:var(--tf-text-muted);background:var(--tf-surface-3);padding:.2em .65em;border-radius:var(--tf-radius-pill);border:1px solid var(--tf-border)}
.tf-halcones-list{display:flex;flex-direction:column;max-height:520px;overflow-y:auto}
.tf-halcon-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem;padding:.8rem 1rem;border-bottom:1px solid var(--tf-border);cursor:pointer;transition:background var(--tf-dur-fast) var(--tf-ease)}
.tf-halcon-item:last-child{border-bottom:none}
.tf-halcon-item:hover{background:var(--tf-yellow-050)}
[data-theme="dark"] .tf-halcon-item:hover{background:rgba(245,158,11,.10)}
.tf-halcon-item.is-active{background:var(--tf-yellow-050);border-left:3px solid var(--tf-yellow-500)}
.tf-halcon-item__dot{width:10px;height:10px;border-radius:50%;background:#9ca3af;flex-shrink:0;position:relative}
.tf-halcon-item__dot.is-live{background:var(--tf-success);box-shadow:0 0 0 4px rgba(16,185,129,.18);animation:tf-pulse 1.6s ease-in-out infinite}
.tf-halcon-item__body{display:flex;flex-direction:column;gap:2px;min-width:0}
.tf-halcon-item__name{font-size:var(--tf-fs-sm);font-weight:var(--tf-fw-semibold);color:var(--tf-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-halcon-item__meta{font-size:.72rem;color:var(--tf-text-subtle);font-family:var(--tf-font-mono)}
.tf-halcon-item__arrow{color:var(--tf-text-subtle);font-size:.9rem;transition:transform var(--tf-dur-fast) var(--tf-ease)}
.tf-halcon-item:hover .tf-halcon-item__arrow{transform:translateX(2px);color:var(--tf-yellow-600)}

/* Botón de tema flotante */
.bf-theme-toggle{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--tf-surface);color:var(--tf-text);border:1px solid var(--tf-border);box-shadow:0 8px 24px rgba(15,23,42,.18),0 2px 6px rgba(15,23,42,.10);cursor:pointer;font-size:1.15rem;z-index:9999;transition:transform var(--tf-dur-fast) var(--tf-ease),background-color var(--tf-dur-fast) var(--tf-ease),color var(--tf-dur-fast) var(--tf-ease)}
.bf-theme-toggle:hover{transform:translateY(-2px);background:var(--tf-yellow-500);color:#17120a;border-color:var(--tf-yellow-600)}
.bf-theme-toggle:active{transform:scale(.96)}
@media(max-width:575.98px){.bf-theme-toggle{bottom:16px;right:16px;width:46px;height:46px;font-size:1.05rem}}

/* Leaflet ajustes sobre tokens */
.leaflet-popup-content-wrapper{background:var(--tf-surface);color:var(--tf-text);border-radius:var(--tf-radius-sm);box-shadow:var(--tf-shadow-md)}
.leaflet-popup-content{margin:10px 12px;font-family:var(--tf-font-body);font-size:var(--tf-fs-sm)}
.leaflet-popup-content strong{display:block;font-family:var(--tf-font-display);font-weight:var(--tf-fw-semibold)}
.leaflet-popup-content small{color:var(--tf-text-muted)}
.leaflet-container .leaflet-control-attribution{background:rgba(11,15,20,.55);color:rgba(255,255,255,.85);font-size:10px}
.leaflet-container .leaflet-control-attribution a{color:var(--tf-yellow-500)}
.leaflet-bar a{background:var(--tf-surface);color:var(--tf-text);border-bottom-color:var(--tf-border)}
.leaflet-bar a:hover{background:var(--tf-surface-3);color:var(--tf-yellow-600)}

/* Iconos de marcador */
.tf-halcon-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform var(--tf-dur) var(--tf-ease)}
.tf-halcon-pin:hover{transform:rotate(-45deg) scale(1.12)}
.tf-halcon-pin>i{transform:rotate(45deg);color:#fff;font-size:.85rem}
.tf-halcon-pin--live{background:linear-gradient(135deg,#FBBF24 0%,#F59E0B 55%,#B45309 100%)}
.tf-halcon-pin--idle{background:#9CA3AF}
</style>
</head>
<body>
<div class="bf-app">
  <header class="bf-topbar">
    <div class="bf-topbar__left">
      <a href="/profile" class="bf-brand">
        <span class="bf-brand__mark"><i class="bi bi-broadcast-pin"></i></span>
        <span class="bf-brand__name">ALCON</span>
      </a>
    </div>
    <div class="bf-topbar__context">
      <i class="bi bi-geo-alt-fill"></i>
      <span>Monitoreo en tiempo real</span>
    </div>
    <div class="bf-topbar__right">
      <button type="button" class="bf-user-btn" title="Cuenta">
        <span class="bf-user-btn__avatar"><i class="bi bi-person"></i></span>
        <span class="bf-user-btn__info">
          <strong>Mi cuenta</strong>
          <small>Usuario</small>
        </span>
      </button>
    </div>
  </header>

  <div class="bf-body">
    <aside class="bf-sidebar">
      <div class="bf-sidebar__header">
        <span class="bf-sidebar__title">Navegación</span>
      </div>
      <nav class="bf-sidebar__nav">
        <a href="/profile" class="bf-sidebar__link" aria-current="page">
          <span class="bf-sidebar__icon"><i class="bi bi-speedometer2"></i></span>
          <span class="bf-sidebar__label">Dashboard</span>
        </a>
        <a href="/profile/edit" class="bf-sidebar__link">
          <span class="bf-sidebar__icon"><i class="bi bi-person-gear"></i></span>
          <span class="bf-sidebar__label">Mi perfil</span>
        </a>
        <hr class="bf-sidebar__divider">
        <form method="POST" action="/logout" style="margin:0">
          <input type="hidden" name="_csrf" value="{{ .csrfToken }}">
          <button type="submit" class="bf-sidebar__link" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;font-family:inherit">
            <span class="bf-sidebar__icon"><i class="bi bi-box-arrow-right"></i></span>
            <span class="bf-sidebar__label">Cerrar sesión</span>
          </button>
        </form>
      </nav>
    </aside>

    <main class="bf-main">
      <div class="container">
        {{ embed }}
      </div>
    </main>
  </div>
</div>

<button type="button" class="bf-theme-toggle" id="themeToggle" aria-label="Cambiar tema">
  <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var root=document.documentElement;
  var btn=document.getElementById('themeToggle');
  var icon=document.getElementById('themeIcon');
  function apply(theme){
    root.setAttribute('data-theme',theme);
    if(icon){icon.className=theme==='dark'?'bi bi-sun-fill':'bi bi-moon-stars-fill';}
  }
  try{
    var saved=localStorage.getItem('alcon-theme');
    var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    apply(saved||(prefersDark?'dark':'light'));
  }catch(e){}
  if(btn){
    btn.addEventListener('click',function(){
      var cur=root.getAttribute('data-theme')==='dark'?'dark':'light';
      var next=cur==='dark'?'light':'dark';
      apply(next);
      try{localStorage.setItem('alcon-theme',next);}catch(e){}
    });
  }
})();
</script>
</body>
</html>
