
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .title }} · Apolo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/bufal.css">
</head>
<body>
  <div class="bf-app">

    <header class="bf-topbar">
      <div class="bf-topbar__left">
        <a href="/" class="bf-brand">
          <img src="/img/apolo-logo.png" alt="Apolo">
        </a>
      </div>

      <nav class="bf-topnav">
        <a class="bf-topnav__link" href="/">
          <i class="bi bi-house"></i><span>Inicio</span>
        </a>
        <a class="bf-topnav__link" href="/tracking" aria-current="page">
          <i class="bi bi-geo-alt"></i><span>Tracking</span>
        </a>
        <a class="bf-topnav__link" href="/drivers">
          <i class="bi bi-truck"></i><span>Drivers</span>
        </a>
        <a class="bf-topnav__link" href="/clients">
          <i class="bi bi-people"></i><span>Clients</span>
        </a>
      </nav>

      <div class="bf-topbar__right">
        <button class="bf-theme-toggle" type="button" aria-label="Cambiar tema">
          <i class="bi bi-moon-stars"></i>
        </button>
        <div class="bf-topbar__legacy-user">
          <button class="bf-user-btn" type="button">
            <span class="bf-user-btn__avatar"><i class="bi bi-person"></i></span>
            <span class="bf-user-btn__info">
              <strong>{{ .user.Name }}</strong>
              <small>{{ .role }}</small>
            </span>
          </button>
        </div>
      </div>
    </header>

    <div class="bf-body">
      <aside class="bf-sidebar">
        <div class="bf-sidebar__header">
          <span class="bf-sidebar__title">Navegación</span>
        </div>
        <nav class="bf-sidebar__nav">
          <a class="bf-sidebar__link" href="/">
            <span class="bf-sidebar__icon"><i class="bi bi-house"></i></span>
            <span class="bf-sidebar__label">Inicio</span>
          </a>
          <a class="bf-sidebar__link" href="/tracking" aria-current="page">
            <span class="bf-sidebar__icon"><i class="bi bi-geo-alt"></i></span>
            <span class="bf-sidebar__label">Tracking en vivo</span>
          </a>
          <a class="bf-sidebar__link" href="/drivers">
            <span class="bf-sidebar__icon"><i class="bi bi-truck"></i></span>
            <span class="bf-sidebar__label">Conductores</span>
          </a>
          <a class="bf-sidebar__link" href="/clients">
            <span class="bf-sidebar__icon"><i class="bi bi-people"></i></span>
            <span class="bf-sidebar__label">Pasajeros</span>
          </a>
          <hr class="bf-sidebar__divider">
          <a class="bf-sidebar__link" href="/profile">
            <span class="bf-sidebar__icon"><i class="bi bi-person-circle"></i></span>
            <span class="bf-sidebar__label">Mi perfil</span>
          </a>
        </nav>
      </aside>

      <main class="bf-main">
        <div class="container">
          {{ embed }}
        </div>
      </main>
    </div>
  </div>

  <script>
    // Toggle tema claro/oscuro persistido en localStorage
    (function () {
      var btn = document.querySelector('.bf-theme-toggle');
      var root = document.documentElement;
      var saved = localStorage.getItem('apolo-theme');
      if (saved) root.setAttribute('data-theme', saved);

      btn && btn.addEventListener('click', function () {
        var cur = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', cur);
        localStorage.setItem('apolo-theme', cur);
        btn.innerHTML = cur === 'dark'
          ? '<i class="bi bi-sun"></i>'
          : '<i class="bi bi-moon-stars"></i>';
      });
      if (root.getAttribute('data-theme') === 'dark') {
        btn.innerHTML = '<i class="bi bi-sun"></i>';
      }
    })();
  </script>
</body>
</html>
