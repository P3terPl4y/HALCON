<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test Halcón · WebSocket</title>
<style>
  :root { --bg:#0f172a; --surface:#1e293b; --border:#334155; --text:#f1f5f9; --muted:#94a3b8;
          --primary:#f59e0b; --success:#10b981; --danger:#ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         padding: 1.5rem; min-height: 100vh; }
  h1 { font-size: 1.2rem; margin-bottom: .35rem; }
  p.sub { color: var(--muted); font-size: .82rem; margin-bottom: 1.25rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .col { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
         padding: 1rem; }
  .col h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em;
            color: var(--muted); margin-bottom: .75rem; }
  label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: .25rem;
          text-transform: uppercase; font-weight: 600; }
  input, button { width: 100%; padding: .6rem .75rem; border-radius: 8px;
                  border: 1px solid var(--border); background: #0f172a; color: var(--text);
                  font-family: inherit; font-size: .9rem; }
  input:focus { outline: none; border-color: var(--primary); }
  button { cursor: pointer; font-weight: 600; margin-top: .5rem;
           background: var(--primary); color: #17120a; border-color: var(--primary); }
  button:hover { filter: brightness(1.08); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem;
            font-size: .82rem; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
  .status.on .dot { background: var(--success); animation: pulse 1.5s infinite; }
  .status.err .dot { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  pre { background: #0a1020; border: 1px solid var(--border); border-radius: 8px;
        padding: .75rem; font-size: .75rem; font-family: monospace; color: #cbd5e1;
        max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
        margin-top: .5rem; }
  .log-line { padding: .15rem 0; }
  .log-line.info  { color: #93c5fd; }
  .log-line.ok    { color: #6ee7b7; }
  .log-line.err   { color: #fca5a5; }
  .log-line.send  { color: #fcd34d; }
  .log-line.recv  { color: #c4b5fd; }
  .field { margin-bottom: .75rem; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Test Halcón · WebSocket</h1>
<p class="sub">Envía coordenadas al endpoint <code>/halcon/:id_user/:id_halcon/</code> y observa la respuesta del servidor.</p>

<div class="row">
  <div class="col">
    <h2>Conexión</h2>

    <div class="field">
      <label>URL WebSocket</label>
      <input type="text" id="wsUrl"
        value="ws://localhost:3000/halcon/1/1/?token=850ccebb90bae93ed1d3a7d4ce837dd1f27ab6ae286716bca67c1731805ff4ff">
    </div>

    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">Desconectado</span>
    </div>

    <button id="btnConnect">Conectar</button>
    <button id="btnDisconnect" class="danger" disabled>Desconectar</button>
  </div>

  <div class="col">
    <h2>Enviar coordenada</h2>

    <div class="field">
      <label>Latitud</label>
      <input type="number" id="lat" value="23.1136" step="any">
    </div>
    <div class="field">
      <label>Longitud</label>
      <input type="number" id="lng" value="-82.3666" step="any">
    </div>

    <button id="btnSend" disabled>Enviar una coordenada</button>
    <button id="btnStream" disabled>▶ Iniciar stream (1/seg)</button>
    <button id="btnStop" class="danger" disabled>■ Detener stream</button>
  </div>
</div>

<div class="col">
  <h2>Log de eventos</h2>
  <button id="btnClear" style="width:auto;padding:.35rem .75rem;font-size:.8rem;margin:0 0 .5rem 0;">Limpiar</button>
  <pre id="log"></pre>
</div>

<script>
(function(){
  'use strict';

  var ws = null;
  var streamTimer = null;

  var els = {
    wsUrl:        document.getElementById('wsUrl'),
    status:       document.getElementById('status'),
    statusText:   document.getElementById('statusText'),
    btnConnect:   document.getElementById('btnConnect'),
    btnDisconnect:document.getElementById('btnDisconnect'),
    btnSend:      document.getElementById('btnSend'),
    btnStream:    document.getElementById('btnStream'),
    btnStop:      document.getElementById('btnStop'),
    btnClear:     document.getElementById('btnClear'),
    lat:          document.getElementById('lat'),
    lng:          document.getElementById('lng'),
    log:          document.getElementById('log'),
  };

  function log(kind, msg){
    var t = new Date().toLocaleTimeString();
    var line = document.createElement('div');
    line.className = 'log-line ' + kind;
    line.textContent = '[' + t + '] ' + msg;
    els.log.appendChild(line);
    els.log.scrollTop = els.log.scrollHeight;
  }

  function setStatus(text, cls){
    els.statusText.textContent = text;
    els.status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function setConnectedUI(connected){
    els.btnConnect.disabled = connected;
    els.btnDisconnect.disabled = !connected;
    els.btnSend.disabled = !connected;
    els.btnStream.disabled = !connected;
    if(!connected){
      els.btnStop.disabled = true;
      stopStream();
    }
  }

  function connect(){
    if(ws && ws.readyState === WebSocket.OPEN) return;

    var url = els.wsUrl.value.trim();
    if(!url){
      log('err', 'URL vacía');
      return;
    }

    log('info', 'Conectando a ' + url);
    setStatus('Conectando…', '');

    try {
      ws = new WebSocket(url);
    } catch (e) {
      log('err', 'Error al crear WebSocket: ' + e.message);
      setStatus('Error', 'err');
      return;
    }

    ws.onopen = function(){
      log('ok', '✅ Conectado al servidor');
      setStatus('Conectado', 'on');
      setConnectedUI(true);
    };

    ws.onmessage = function(ev){
      log('recv', '📩 ' + ev.data);
    };

    ws.onerror = function(e){
      log('err', '❌ Error: ' + (e.message || 'desconocido'));
      setStatus('Error', 'err');
    };

    ws.onclose = function(e){
      log('info', '🔌 Conexión cerrada (code=' + e.code + (e.reason ? ', reason=' + e.reason : '') + ')');
      setStatus('Desconectado', '');
      setConnectedUI(false);
      ws = null;
    };
  }

  function disconnect(){
    if(ws){
      log('info', 'Cerrando conexión…');
      ws.close();
    }
  }

  function sendCoord(){
    if(!ws || ws.readyState !== WebSocket.OPEN){
      log('err', 'No hay conexión activa');
      return;
    }
    var lat = parseFloat(els.lat.value);
    var lng = parseFloat(els.lng.value);
    if(isNaN(lat) || isNaN(lng)){
      log('err', 'Latitud/longitud inválidas');
      return;
    }
    var payload = JSON.stringify({ latitude: lat, longitude: lng });
    ws.send(payload);
    log('send', '📤 ' + payload);
  }

  function startStream(){
    if(streamTimer) return;
    log('info', '▶ Stream iniciado (1 envío/segundo)');
    els.btnStream.disabled = true;
    els.btnStop.disabled = false;
    streamTimer = setInterval(sendCoord, 1000);
    sendCoord(); // primer envío inmediato
  }

  function stopStream(){
    if(streamTimer){
      clearInterval(streamTimer);
      streamTimer = null;
      log('info', '■ Stream detenido');
    }
    if(ws && ws.readyState === WebSocket.OPEN){
      els.btnStream.disabled = false;
      els.btnStop.disabled = true;
    }
  }

  els.btnConnect.addEventListener('click', connect);
  els.btnDisconnect.addEventListener('click', disconnect);
  els.btnSend.addEventListener('click', sendCoord);
  els.btnStream.addEventListener('click', startStream);
  els.btnStop.addEventListener('click', stopStream);
  els.btnClear.addEventListener('click', function(){ els.log.innerHTML = ''; });

  setConnectedUI(false);
  log('info', 'Listo. Pulsa "Conectar" para iniciar la prueba.');
})();
</script>
</body>
</html>
